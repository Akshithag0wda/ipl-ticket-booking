<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <header>
        <nav>
            <h2>IPL TICKETS</h2>
            <a href="index.html">Home</a>
            <a href="booking.html">Book Ticket</a>
        </nav>
    </header>

    <main>
        <section class="booking-page">
            <h1>Ticket Booking Form</h1>

            <form id="bookingForm">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name"
                       minlength="3" maxlength="50" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       minlength="10" maxlength="10"
                       pattern="[0-9]{10}" required>

                <label for="match">Select Match:</label>
                <select id="match" name="match" required>
                    <option value="">Choose a match</option>
                    <option value="RCB-CSK">RCB vs CSK</option>
                    <option value="MI-KKR">MI vs KKR</option>
                    <option value="CSK-DC">CSK vs DC</option>
                </select>

                <label for="category">Stand Category:</label>
                <select id="category" name="category" required>
                    <option value="">Choose a category</option>
                    <option value="general">General</option>
                    <option value="premium">Premium</option>
                    <option value="vip">VIP</option>
                </select>

                <label for="tickets">Number of Tickets:</label>
                <input type="number" id="tickets" name="tickets"
                       min="1" max="10" required>

                <p>Booking Preference:</p>

                <label>
                    <input type="radio" name="preference"
                           value="together" required>
                    Seats together
                </label>

                <label>
                    <input type="radio" name="preference"
                           value="any">
                    Any available seats
                </label>

                <button type="submit">Submit</button>
                <button type="reset">Reset</button>

            </form>

            <p id="successMessage" role="status"></p>
        </section>
    </main>

    <script>
        const form = document.getElementById("bookingForm");
        const message = document.getElementById("successMessage");

        form.addEventListener("submit", function(event) {
            event.preventDefault();
            message.textContent = "Booking submitted successfully!";
        });

        form.addEventListener("reset", function() {
            message.textContent = "";
        });
    </script>

</body>
</html>
